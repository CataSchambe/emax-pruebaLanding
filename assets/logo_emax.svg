<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" class="emax-brand-logo">
  <g class="logo-symbol">
    <defs>
      <linearGradient id="emaxBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00A3FF"/>
        <stop offset="50%" stop-color="#2563EB"/>
        <stop offset="100%" stop-color="#1D4ED8"/>
      </linearGradient>
      <linearGradient id="emaxGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
      </linearGradient>
      <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>
    
    <circle cx="28" cy="32" r="24" fill="url(#emaxGlowGrad)"/>
    <polygon points="33,10 17,33 26,33 21,54 39,29 30,29" fill="url(#emaxBoltGrad)" filter="url(#boltGlow)"/>
    <polygon points="33,10 26,24 23,33 26,33 21,54 26,34 30,29" fill="#60A5FA" opacity="0.8"/>
    <polygon points="33,10 30,22 39,29 30,29" fill="#93C5FD" opacity="0.9"/>
  </g>
  
  <g class="logo-text">
    <text x="64" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="3.5" fill="currentColor" opacity="0.75">GRUPO</text>
    <text x="64" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="26" font-weight="800" letter-spacing="1.5" fill="currentColor">EMAX</text>
    <circle cx="164" cy="40" r="3" fill="#F48515"/>
    <text x="174" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#F48515">ASESORÍA</text>
  </g>
</svg>
